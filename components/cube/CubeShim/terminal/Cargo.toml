[package]
name = "cube-terminal"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
server = ["dep:tokio", "dep:libc", "dep:vt100", "dep:async-trait", "dep:serde_json"]

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
libc = { version = "0.2", optional = true }
# The std feature gives VTE an unbounded OSC buffer. Its no_std parser uses a
# fixed 1 KiB buffer while retaining alloc-backed screen formatting.
vt100 = { version = "=0.18.1", path = "../vendor/vt100", default-features = false, optional = true }
async-trait = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = "3"
