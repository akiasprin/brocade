syntax = "proto3";

package xray.proxy.dokodemo;
option csharp_namespace = "Xray.Proxy.Dokodemo";
option go_package = "github.com/xtls/xray-core/proxy/dokodemo";
option java_package = "com.xray.proxy.dokodemo";
option java_multiple_files = true;

import "common/net/address.proto";
import "common/net/network.proto";

message Config {
  // List of networks that the Dokodemo accepts.
  repeated xray.common.net.Network allowed_networks = 7;
  xray.common.net.IPOrDomain rewrite_address = 1;
  uint32 rewrite_port = 2;
  map<string, string> port_map = 3;
  bool follow_redirect = 5;
  uint32 user_level = 6;
  ForwardingTargetPolicy forwarding_target_policy = 8;
}

// Only user-managed forwarding listeners use this policy. Ordinary dokodemo
// inbounds (including the local management API) keep their existing behavior.
message ForwardingTargetPolicy {
  repeated string blocked_cidrs = 1;
}

// A distinct type makes old Xray processes reject protected listeners instead
// of silently discarding the added policy field during a mixed-version handoff.
message ForwardingConfig { Config config = 1; }
