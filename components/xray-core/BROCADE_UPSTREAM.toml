# Canonical Xray source baseline; keep the upstream Go module path unchanged.
repository = "https://github.com/XTLS/Xray-core.git"
tag = "v26.10.21"
commit = "1b1647cd9ddf0abc34b981d4611fc03bcac1ca74"
imported_at = "2026-10-28"
license = "MPL-2.0"

# Retained Brocade capabilities. Official Xray binaries do not provide these contracts.
anytls = true
external_tls_allow_insecure = true
sniffing_failure_routing = true
secure_dokodemo_splice = true
legacy_agent_vision_splice = true
online_source_protocols = true
machine_traffic_limit = true
user_traffic_limit = true
reality_legacy_x25519 = true
reality_empty_encrypted_extensions = true
reverse_drain_fence = true

# Former 26.4.25 backports are absorbed by the new baseline. Brocade-specific behavior is
# reapplied to the new APIs: atomic routing snapshots, persistent accounting/checkpoints,
# source access, session revocation, Mux/reverse health, TLS/kTLS, listener handoff, DNS
# provenance/retries, bounded tunnel DNS caches and UDP mask/hopping GSO preservation.
# Historical finalmask.quicParams.udpHop inputs are lowered to a compatibility mask;
# the general upstream UDP-hop mask retains its independent local/remote semantics.

[[dependencies]]
module = "github.com/xtls/reality"
path = "third_party/reality"
upstream = "83f621788ca88b83179810b12baa7ae518aacb83"
description = "Connection-scoped legacy X25519 admission and record-size-compatible optional SNI acknowledgement; see dependency baseline"
