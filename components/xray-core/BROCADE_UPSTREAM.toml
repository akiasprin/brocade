# Brocade's vendored Xray baseline. Keep the Go module path unchanged so upstream
# packages and future protocol patches continue to use their canonical imports.

repository = "https://github.com/XTLS/Xray-core.git"
tag = "v26.4.25"
commit = "b4f08981becb71eaa995fa98ed2098ade92566bb"
imported_at = "2026-09-03"
license = "MPL-2.0"

# Brocade-maintained capabilities carried on top of this upstream baseline. The fork is the only
# Xray runtime supported by Brocade; the unpatched community binary is not a compatible deployment
# target. `sniffing_failure_routing` marks IP destinations whose bounded sniffing attempt did not
# recover a domain, allowing an explicit safe route instead of falling through to the default.
anytls = true
sniffing_failure_routing = true
