# The module keeps its canonical import path. Config.AllowLegacyX25519 is opt-in at
# this dependency layer; Brocade enables it by default for historical server configs.
# Modern profiles still need their complete hybrid key share. Authentication remains
# subject to ECDH, AEAD, SNI, short ID and the configured version/time constraints.
legacy_x25519_admission = true
optional_sni_ack_fits_record = true
# The official handshake's unreachable tail is removed so full go vet can run.
unreachable_handshake_tail_removed = true
