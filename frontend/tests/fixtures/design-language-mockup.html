<!doctype html>
<html lang="zh-CN" data-theme="dark" data-palette="dailan">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" />
    <title>设计语言 mockup</title>
    <script>
      /* 首帧之前写好设计语言与主题：生产的颜色过渡不应从旧外观渐变过来。
         语言 → 中性底：液态玻璃与分组卡片取 iOS 系统灰，原生桌面取 macOS，展示页取 iOS 再自定纸色。 */
      (() => {
        const params = new URLSearchParams(location.search);
        const theme = params.get('theme') === 'light' ? 'light' : 'dark';
        try {
          localStorage.setItem('brocade-console:theme', theme);
          localStorage.setItem('brocade-console:palette', 'dailan');
        } catch {}
        const base = { glass: 'ios', native: 'mac', grouped: 'ios', showcase: 'ios' };
        const lang = params.get('lang') ?? 'glass';
        const root = document.documentElement;
        root.dataset.theme = theme;
        if (lang in base) {
          root.dataset.lang = lang;
          root.dataset.base = base[lang];
          root.dataset.accent = 'blue';
        }
        document.querySelector('meta[name="color-scheme"]').content = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="mk-dock"></div>
    <script type="module">
      import RefreshRuntime from '/@react-refresh';
      RefreshRuntime.injectIntoGlobalHook(window);
      window.$RefreshReg$ = () => {};
      window.$RefreshSig$ = () => type => type;
      window.__vite_plugin_react_preamble_installed__ = true;
    </script>
    <script type="module" src="./design-language-mockup.tsx"></script>
  </body>
</html>
