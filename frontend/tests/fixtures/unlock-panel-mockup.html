<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>解锁面板 · 整体设计 mockup</title>
    <script>
      (() => {
        // 主题与色板写进本地偏好后再加载模块：外壳的主题、色板仓库在模块初始化时读取。
        const query = new URLSearchParams(location.search);
        const theme = query.get('theme') === 'light' ? 'light' : 'dark';
        const palette = query.get('palette') || 'dailan';
        try {
          localStorage.setItem('brocade-console:theme', theme);
          localStorage.setItem('brocade-console:palette', palette);
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.palette = palette;
        document.querySelector('meta[name="color-scheme"]').content = theme;
      })();
    </script>
  </head>
  <body>
    <div id="mk-root"></div>
    <div id="root"></div>
    <script type="module">
      import RefreshRuntime from '/@react-refresh';
      RefreshRuntime.injectIntoGlobalHook(window);
      window.$RefreshReg$ = () => {};
      window.$RefreshSig$ = () => type => type;
      window.__vite_plugin_react_preamble_installed__ = true;
    </script>
    <script type="module" src="./unlock-panel-mockup.tsx"></script>
  </body>
</html>
