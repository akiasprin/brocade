<!doctype html>
<html lang="zh-CN" data-theme="dark" data-palette="dailan">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" />
    <title>配色彩度 mockup</title>
    <script>
      /* 首帧之前写好方案与主题：生产的颜色过渡不应从现状配色渐变过来。 */
      (() => {
        const params = new URLSearchParams(location.search);
        const theme = params.get('theme') === 'light' ? 'light' : 'dark';
        try {
          localStorage.setItem('brocade-console:theme', theme);
          localStorage.setItem('brocade-console:palette', 'dailan');
        } catch {}
        const scheme = params.get('scheme') ?? 'a';
        const root = document.documentElement;
        root.dataset.theme = theme;
        if (['a', 'b', 'c', 'd'].includes(scheme)) root.dataset.scheme = scheme;
        document.querySelector('meta[name="color-scheme"]').content = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="mk-dock"></div>
    <script type="module">
      import RefreshRuntime from '/@react-refresh';
      RefreshRuntime.injectIntoGlobalHook(window);
      window.$RefreshReg$ = () => {};
      window.$RefreshSig$ = () => type => type;
      window.__vite_plugin_react_preamble_installed__ = true;
    </script>
    <script type="module" src="./color-scheme-mockup.tsx"></script>
  </body>
</html>
