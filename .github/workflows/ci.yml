# Build and test.
#
# This repository needs a few prerequisites an ordinary Rust project does not, each argued where it
# is imposed — `crates/brocade-console/build.rs` and `rust-toolchain.toml`:
#
#   - Two musl targets, because the control plane compiles both the x86_64 and the aarch64 agent
#     into itself. `rust-toolchain.toml` already declares them under `targets`, so rustup installs
#     them on its own and there is no step for it here.
#   - zig, because the agent's ring dependency has C and assembly while rustup's musl target ships
#     no headers.
#   - npm, because the console front end is compiled into the control plane too.
#   - The Go version declared by Xray's go.mod, because the same build also embeds Brocade Xray.
#
# Only actions from the `actions/` organization are used. A third-party action in CI holds the
# permission to change what this repository produces, and what this repository produces runs as root
# on other people's machines — `install.sh` refuses the same class of thing at its top. The cost is
# writing the caching out by hand; see the two `actions/cache` steps.

name: ci

# Every branch, not only main. Narrowed to main, changing CI itself could not be verified before
# merging it: `workflow_dispatch` does not appear in the UI for a non-default branch (GitHub reads
# the manual-trigger list from the default branch only), which would leave pushing straight to main
# as the sole way to find out.
on:
  push:
  workflow_dispatch:

# A new push on a branch cancels the run still going for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Read-only is enough. This workflow writes nothing back to the repository, publishes no release and
# touches no packages.
permissions:
  contents: read

jobs:
  cvm-cube:
    name: optional Cube node runtime boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/configure-apt
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: components/cube/.go-version
          cache-dependency-path: components/cube/Cubelet/go.sum
      - name: Verify Cube installer and ELF libc baseline
        run: python3 -m unittest discover -s scripts/tests/cvm -p 'test_*.py'
      - name: Build and vet Cubelet Guest command client
        working-directory: components/cube/pkgs/nodeexec
        run: |
          go build ./...
          go vet ./...
      - name: Prepare CubeVS BPF compiler
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev
      - name: Generate and verify the canonical Cube network sources
        run: |
          cd components/cube/CubeNet/cubevs
          GOARCH=amd64 go generate ./...
          go vet ./...
          go test -c -race -o "$RUNNER_TEMP/cubevs-tests"
          docker run --rm --network none --privileged \
            -e CUBE_RUN_BPF_TESTS=1 \
            -v "$RUNNER_TEMP/cubevs-tests:/test:ro" \
            ubuntu@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c \
            /test -test.v -test.count=1
      - name: Verify durable Cubelet attachment and protected-root boundaries
        working-directory: components/cube/Cubelet
        run: |
          go test -race ./network/attachments
          go vet ./network/attachments
          CGO_ENABLED=0 go test ./storage -run '^TestBrocadeRoot' -count=1

  xray-data-plane:
    name: xray data-plane test, vet and race
    runs-on: ubuntu-latest
    # Fixed work avoids Go's fuzztime deadline race (go.dev/issue/75804).
    # 300k covers the observed work from the former 10s budgets; each test keeps its 2m limit.
    env:
      BROCADE_FUZZ_LIMIT: 300000x
    defaults:
      run:
        working-directory: components/xray-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read Xray minimum compiler
        id: xray-go
        run: |
          pinned=$(cat "$GITHUB_WORKSPACE/components/xray-core/.go-version")
          echo "version=~${pinned}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ steps.xray-go.outputs.version }}
          check-latest: true
          cache-dependency-path: components/xray-core/go.sum

      - name: Prepare pinned Xray assets
        run: sh "$GITHUB_WORKSPACE/scripts/prepare-xray-assets.sh"

      - name: REALITY compatibility boundaries and dependency races
        run: |
          go test -race ./transport/internet/reality -count=3 -timeout=2m
          go vet ./transport/internet/reality
          go -C third_party/reality test -race -run '^TestBrocade' -count=3 -timeout=2m .
          go -C third_party/reality vet .

      - name: REALITY real-process fingerprint and cover compatibility
        run: |
          go build -buildvcs=false -o "$RUNNER_TEMP/reality-xray" ./main
          fixture="$GITHUB_WORKSPACE/scripts/tests/xray-reality-compat/run.py"
          python3 "$fixture" --binary "$RUNNER_TEMP/reality-xray" --label default
          python3 "$fixture" --binary "$RUNNER_TEMP/reality-xray" --label strict --strict
          python3 "$fixture" --binary "$RUNNER_TEMP/reality-xray" --label empty --empty-cover
          python3 "$fixture" --binary "$RUNNER_TEMP/reality-xray" --label strict-empty --strict --empty-cover

      - name: Xray reachable-vulnerability audit
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./main

      - name: Frozen Xray admission, attribution and DNS end-to-end contracts
        env:
          BROCADE_XRAY_BIN: ${{ runner.temp }}/reality-xray
        run: |
          go test ./testing/scenarios \
            -run '^TestBrocadeFrozen(DNSRetryCacheAndProtocol|DNSColdWarmDiagnosticsAndBudget|DNSCanceledLeaderAndStaleRefresh|SourceBansAndAttribution|SiteStatisticsDoNotDuplicateRelay|OtherDomainAndFailedTargetAttribution|SS2022OversizedKeys)$' \
            -count=1 -timeout=3m

      - name: QUIC sniffing compatibility, fuzz seeds and races
        run: |
          go test -race ./common/protocol/quic -count=3 -timeout=2m
          go vet ./common/protocol/quic

      - name: MTProxy real-process budgets, accounting and revocation
        run: |
          go test -c -o "$RUNNER_TEMP/mtproto-tests" ./proxy/mtproto
          sudo unshare --net -- env BROCADE_XRAY_BIN="$RUNNER_TEMP/reality-xray" \
            bash -euo pipefail -c '
              ip link set lo up
              ip addr add 198.51.100.2/32 dev lo
              exec "$1" -test.v -test.run "^TestBrocadeFrozenMTProxy" -test.count=1 -test.timeout=2m
            ' -- "$RUNNER_TEMP/mtproto-tests"

      - name: QUIC Initial parser fuzz
        run: go test ./common/protocol/quic -run '^$' -fuzz '^FuzzSniffQUIC$' -fuzztime="${BROCADE_FUZZ_LIMIT}" -timeout=2m

      - name: ActivityTimer deterministic concurrency regressions
        run: go test -race ./common/signal -run '^TestActivityTimerConcurrent' -count=100 -timeout=1m

      - name: ActivityTimer real-time races and package compatibility
        run: |
          go test -race ./common/signal -run '^TestActivityTimerRealTimeShortTimeoutRace$' -count=20 -timeout=1m
          go test -race ./common/signal -count=1 -timeout=1m
          go vet ./common/signal

      - name: Raw splice half-close and idle regressions
        run: |
          go test -race ./proxy -run '^TestCopyRawConn(ActivitySurvivesHalfClose|CloseWakesBlockedSplice)$' -count=5 -timeout=2m
          go test -race ./proxy ./proxy/freedom -count=1 -timeout=3m
          go vet ./proxy ./proxy/freedom

      - name: DNS provenance, cache ownership and blackhole response synchronization
        run: |
          go test -race ./features/probetrace ./app/dispatcher ./proxy/dns ./proxy/blackhole -count=3 -timeout=3m
          go test -race ./app/dns -run '^Test(DNSDispatch|SerialTrace|RuleDNS|ParallelRuleGroup|ResponseTTL|UDPDomainResolver|LongDomain)' -count=3 -timeout=3m
          go vet ./features/probetrace ./app/dispatcher ./app/dns ./features/dns ./proxy/dns ./proxy/blackhole

      - name: Data-plane deterministic, kTLS and fuzz-seed tests
        run: |
          go test ./proxy/anytls -count=10 -timeout=5m
          go test ./transport/internet/tls -count=1 -timeout=5m
          go test ./proxy/mtproto -count=10 -timeout=5m

      - name: AnyTLS settings fuzz
        run: go test ./proxy/anytls -run '^$' -fuzz '^FuzzAnyTLSSettings$' -fuzztime="${BROCADE_FUZZ_LIMIT}" -timeout=2m

      - name: AnyTLS padding fuzz
        run: go test ./proxy/anytls -run '^$' -fuzz '^FuzzAnyTLSPaddingScheme$' -fuzztime="${BROCADE_FUZZ_LIMIT}" -timeout=2m

      - name: AnyTLS session-frame fuzz
        run: go test ./proxy/anytls -run '^$' -fuzz '^FuzzAnyTLSSessionFrames$' -fuzztime="${BROCADE_FUZZ_LIMIT}" -timeout=2m

      - name: AnyTLS UoT-record fuzz
        run: go test ./proxy/anytls -run '^$' -fuzz '^FuzzAnyTLSUoTRecords$' -fuzztime="${BROCADE_FUZZ_LIMIT}" -timeout=2m

      - name: Data-plane race tests
        run: go test -race ./transport/internet/tls ./proxy/anytls ./proxy/mtproto -count=3 -timeout=10m

      - name: Data-plane vet
        run: go vet ./transport/internet/tls ./proxy/anytls ./proxy/mtproto

      - name: Shadowsocks relay key and early-close compatibility
        run: |
          go test -race ./proxy/shadowsocks_2022 -count=3 -timeout=2m
          go vet ./proxy/shadowsocks_2022

      - name: Quota revocation sessions and user isolation
        run: |
          go test -race ./common/protocol ./proxy/vless/... ./proxy/hysteria/... ./transport/internet/hysteria -count=3 -timeout=3m
          go vet ./common/protocol ./proxy/vless ./proxy/hysteria/... ./transport/internet/hysteria
          go vet -unsafeptr=false ./proxy/vless/...
          go test ./core -run '^TestVersionStatementAdvertises' -count=1

      - name: Quota revocation real-process shared-listener and HTTP2 isolation
        run: |
          go test -race ./testing/scenarios -run '^TestQuotaRevocationRealProcesses' -count=3 -timeout=5m

      - name: Source IP admission, live sessions and trusted split frontend
        run: |
          go test -race ./common/sourceaccess ./app/proxyman/inbound ./transport/internet/splithttp -count=3 -timeout=3m
          go vet ./common/sourceaccess ./app/proxyman/inbound ./transport/internet/websocket ./transport/internet/httpupgrade
          go vet ./transport/internet/splithttp

      - name: Online source protocol tracking
        run: |
          go test -race ./app/stats/... ./app/dispatcher ./features/stats ./common/machinelimit -count=3 -timeout=3m
          go vet ./app/stats/... ./app/dispatcher ./features/stats ./common/machinelimit

      - name: Atomic routing reload, RPC and webhook concurrency regressions
        run: |
          go test -race ./app/router/... -count=3 -timeout=3m
          go vet ./app/router/...

      - name: Site observation catalog and deterministic importer
        run: |
          go test -race ./common/siteusage/...
          go vet ./common/siteusage/...

      - name: WARP MASQUE transport and node stack
        run: |
          go test -race ./proxy/masque/... ./proxy/wireguard/... ./transport/internet/masque/... ./transport/internet/tls ./transport/internet/finalmask/... -count=1 -timeout=3m
          go vet ./proxy/masque/... ./proxy/wireguard/... ./transport/internet/masque/... ./transport/internet/finalmask/...

      - name: Mux and reverse deterministic tests
        run: go test ./common/buf ./common/mux ./app/reverse ./app/proxyman/outbound ./app/stats/command ./infra/conf ./proxy/vless/... -count=1 -timeout=10m

      - name: Mux metadata fuzz
        run: go test ./common/mux -run '^$' -fuzz '^FuzzFrameMetadataUnmarshal$' -fuzztime="${BROCADE_FUZZ_LIMIT}" -timeout=2m

      - name: Mux reverse-health framing fuzz
        run: go test ./common/mux -run '^$' -fuzz '^FuzzProbeFrameRoundTrip$' -fuzztime="${BROCADE_FUZZ_LIMIT}" -timeout=2m

      # These launch real Xray processes and put a controllable TCP fault proxy
      # between them. Unit-level state-machine checks cannot prove failover,
      # stream preservation, bounded reconnects, or process shutdown behavior.
      - name: Mux and reverse real-process fault tests
        run: |
          go test ./testing/scenarios \
            -run '^(TestMuxWorkerPoolRealProcesses|TestMuxWorkerPoolRealProcessFaultMatrix|TestMuxWorkerPoolShutdownDuringBlackholedProbe|TestReverseProxy)$' \
            -count=1 -timeout=10m

      - name: VLESS reverse instrumented real-process fault tests
        env:
          XRAY_COV: ${{ runner.temp }}/xray-reverse-coverage
        run: |
          mkdir -p "${XRAY_COV}"
          go test -tags=coverage ./testing/scenarios \
            -run '^TestVLESSReverseRealProcess(ConcurrencyAndRestart|UDPDataPlane|OneWayBlackholeRecovery|PortalOutageBackoff)$' \
            -count=1 -timeout=5m
          go tool covdata textfmt -i="${XRAY_COV}" -o="${RUNNER_TEMP}/xray-reverse.out"
          go tool cover -func="${RUNNER_TEMP}/xray-reverse.out" > "${RUNNER_TEMP}/xray-reverse-summary.txt"
          awk '
            ($1 ~ /common\/mux\/reverse_health.go:/ && $2 == "failHealthLocked") ||
            ($1 ~ /app\/reverse\/portal.go:/ && $2 == "PickAvailable") ||
            ($1 ~ /proxy\/vless\/inbound\/inbound.go:/ && $2 == "NewMux") ||
            ($1 ~ /proxy\/vless\/outbound\/outbound.go:/ && $2 == "monitor") {
              coverage = $3
              sub(/%/, "", coverage)
              print
              found++
              if (coverage + 0 < 50) failed = 1
            }
            END { if (found != 4 || failed) exit 1 }
          ' "${RUNNER_TEMP}/xray-reverse-summary.txt"
          tail -n 1 "${RUNNER_TEMP}/xray-reverse-summary.txt"

      - name: Mux and reverse vet
        run: |
          go vet ./common/buf ./common/mux ./app/reverse ./app/proxyman/outbound ./app/stats/command ./infra/conf ./proxy/vless ./testing/scenarios
          # Vision intentionally reaches TLS implementation fields through unsafe.Pointer.
          # Keep every other analyzer enabled for the VLESS subpackages.
          go vet -unsafeptr=false ./proxy/vless/...
          go vet -tags='coverage coveragemain' ./main ./testing/scenarios
          go vet -race ./testing/scenarios

      - name: Mux and reverse race tests
        run: |
          go test -race ./common/buf ./common/mux ./app/reverse ./proxy/vless/... -count=1 -timeout=10m
          go test -race ./testing/scenarios \
            -run '^TestVLESSReverseRealProcess(ConcurrencyAndRestart|UDPDataPlane|OneWayBlackholeRecovery|PortalOutageBackoff)$' \
            -count=1 -timeout=5m

  check:
    name: fmt + clippy + test (${{ matrix.flavor }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        flavor: [base, cvm]
    env:
      BROCADE_RUN_PG_TESTS: "1"
      BROCADE_CARGO_FEATURES: ${{ matrix.flavor == 'cvm' && 'brocade-agent/cvm,brocade-console/cvm,brocade-store/cvm,brocade-deployment/cvm' || '' }}
      BROCADE_CRATE_FEATURES: ${{ matrix.flavor == 'cvm' && 'cvm' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - uses: ./.github/actions/configure-apt

      - name: Check the POSIX installer
        run: sh -n install.sh

      - name: Reject whitespace errors in this revision
        run: |
          if git cat-file -e HEAD^:components/cube/BROCADE_UPSTREAM.toml 2>/dev/null; then
            git diff --check HEAD^ HEAD
          else
            # Preserve upstream formatting only for the first vendored Cube import.
            git diff --check HEAD^ HEAD -- . ':!components/cube'
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Xray handoff evidence verifier contract
        run: node --test scripts/tests/xray-handoff/*.test.cjs scripts/tests/xray-halfclose/*.test.cjs

      - name: Install front-end dependencies
        working-directory: frontend
        run: npm ci

      - name: Front-end dependency vulnerability audit
        working-directory: frontend
        run: npm audit --package-lock-only --audit-level=high

      - name: Install the browser used by front-end tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install fonts and native test libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-dejavu-core libcap-ng-dev libseccomp-dev
          fc-match 'Noto Sans CJK SC'
          fc-match 'Noto Serif CJK SC'
          fc-match monospace

      - name: Read Xray minimum compiler
        id: xray-go
        run: |
          pinned=$(cat "$GITHUB_WORKSPACE/components/xray-core/.go-version")
          echo "version=~${pinned}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ steps.xray-go.outputs.version }}
          check-latest: true
          cache-dependency-path: components/xray-core/go.sum

      # With no argument, this reads `rust-toolchain.toml` — the version, rustfmt, clippy and the
      # two musl targets. Naming a version here instead would let the two drift apart.
      - name: Install the toolchain rust-toolchain.toml declares
        run: rustup toolchain install

      - uses: ./.github/actions/install-zig

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Only what was downloaded, not `target/`. actions/cache does not write back to a key it
          # already hit, so a cached `target/` would stay whatever the first run produced and grow
          # steadily staler — while checkout stamps every file with the current time anyway, so the
          # compilation that should re-run still does. It saves little, and correctness comes first.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Persist only bounded verification evidence, never compiled binaries. A unique save key
      # allows successful runs to extend the ledger; a cache miss triggers independent rebuilding.
      - name: Restore Xray reproducibility evidence
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/brocade-xray-verified/records.json
          key: xray-evidence-v1-${{ runner.os }}-check-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: xray-evidence-v1-${{ runner.os }}-check-

      # Query OSV directly instead of downloading and executing a scanner during CI. Include the
      # full Cargo resolution, not only packages reached on the runner's host target.
      - name: Rust dependency vulnerability audit
        run: |
          python3 -m unittest discover -s scripts/tests -p test_rust_vulnerability_audit.py
          python3 -m unittest discover -s scripts/tests -p test_build_release.py
          python3 -m unittest discover -s scripts/tests -p test_prepare_consolidated_0003_compat.py
          metadata="${RUNNER_TEMP}/rust-audit-metadata.json"
          cargo metadata --format-version 1 --locked > "$metadata"
          results=$(
            cat "$metadata" |
              jq -c '{queries: [.resolve.nodes[].id as $id | .packages[] | select(.id == $id and .source != null) | {package: {ecosystem: "crates.io", name: .name}, version: .version}]}' |
              curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 60 \
                --header 'Content-Type: application/json' --data-binary @- https://api.osv.dev/v1/querybatch |
              jq -c --slurpfile metadata "$metadata" -f scripts/rust-vulnerability-audit.jq
          )
          if [ "$results" != '[]' ]; then
            echo "$results" | jq -r '.[] | [.id, (.summary // "known vulnerability")] | @tsv'
            exit 1
          fi

      - run: cargo fmt --all -- --check

      - run: cargo clippy --workspace --all-targets --no-default-features --features "$BROCADE_CARGO_FEATURES" --locked -- -D warnings

      - name: Verify Shim-owned persistent terminals
        run: |
          cargo test --manifest-path components/cube/CubeShim/Cargo.toml -p cube-terminal --features server --locked
          cargo clippy --manifest-path components/cube/CubeShim/Cargo.toml -p cube-terminal --features server --all-targets --locked -- -D warnings

      - name: Verify Guest exit receipts before releasing terminal admission
        run: cargo test --manifest-path components/cube/CubeShim/Cargo.toml -p containerd-shim-cube-rs --lib --locked terminal_exit_tests

      - name: Bind real Xray tests to this Console build
        run: |
          set -euo pipefail
          mapfile -t xray_candidates < <(find target/debug/build -path '*/out/xray-x86_64' -type f -print)
          test "${#xray_candidates[@]}" -gt 0
          expected_sha=$(sha256sum "${xray_candidates[0]}" | cut -d ' ' -f 1)
          for candidate in "${xray_candidates[@]}"; do
            test "$(sha256sum "$candidate" | cut -d ' ' -f 1)" = "$expected_sha"
          done
          install -m 0755 "${xray_candidates[0]}" "$RUNNER_TEMP/check-xray"
          sh scripts/prepare-xray-assets.sh
          echo "BROCADE_XRAY_BIN=$RUNNER_TEMP/check-xray" >> "$GITHUB_ENV"
          echo "XRAY_LOCATION_ASSET=$GITHUB_WORKSPACE/components/xray-core/resources" >> "$GITHUB_ENV"

      # BROCADE_RUN_PG_TESTS is not optional here. Without it the integration tests skip silently
      # and CI is green all the same — and what green means quietly becomes "nobody has exercised
      # the database layer". The runner ships docker, so testcontainers starts.
      - name: Rust workspace tests
        run: cargo test --workspace --no-default-features --features "$BROCADE_CARGO_FEATURES" --locked

      - name: PostgreSQL store integration tests
        run: cargo test -p brocade-store --test pg_integration --features "$BROCADE_CRATE_FEATURES" --locked -- --ignored

      - name: First-release identity and fresh database commands
        run: cargo test -p brocade-console --test product_cli --features "$BROCADE_CRATE_FEATURES" --locked -- --include-ignored

      - name: Installer variant gates and CVM-only maintenance
        run: |
          python3 -m unittest discover -s scripts/tests -p test_product_variants.py
          python3 -m unittest discover -s scripts/tests -p test_cvm_cleanup.py

      - name: PostgreSQL tunnel probe integration tests
        run: cargo test -p brocade-store --test tunnel_probe_pg --locked -- --ignored

      - name: Console HTTP integration tests
        run: cargo test -p brocade-console --test http_integration --features "$BROCADE_CRATE_FEATURES" --locked -- --ignored

      - name: PostgreSQL performance event integration test
        run: cargo test -p brocade-console --lib --locked sqlx_events_really_include_query_and_pool_timings -- --ignored

      - name: Read-only performance baseline contract
        run: node --test scripts/performance-baseline.test.mjs

      - name: Agent online protocols against a real Xray process
        run: |
          CGO_ENABLED=0 go -C components/xray-core build -buildvcs=false -trimpath -o "${RUNNER_TEMP}/presence-xray" ./main
          BROCADE_XRAY_BIN="${RUNNER_TEMP}/presence-xray" cargo test -p brocade-agent --locked native_grpc_round_trips_against_xray -- --ignored

      - name: Front-end lint, tests and self-checks
        id: frontend
        working-directory: frontend
        run: |
          npm run lint:strict
          npm test
          node scripts/route-check.mjs
          BROCADE_PRODUCT_FLAVOR=base npm run test:react -- tests/product-variants.test.tsx
          BROCADE_PRODUCT_FLAVOR=base npm run build
          BROCADE_PRODUCT_FLAVOR=cvm npm run build
          BROCADE_PRODUCT_FLAVOR=base npx playwright test tests/visual/product-variants.spec.ts --workers=1
          BROCADE_PRODUCT_FLAVOR=cvm npx playwright test tests/visual/product-variants.spec.ts tests/visual/cvm/cvm-hosts.spec.ts --workers=1

      - name: Preserve failed visual comparisons
        if: failure() && steps.frontend.conclusion == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-visual-${{ matrix.flavor }}
          path: |
            .tools/frontend-visual/results
            .tools/frontend-visual/report
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: brocade dist (${{ matrix.flavor }}-${{ matrix.arch }}-${{ matrix.libc }})
    # GNU artifacts must load on Ubuntu 22.04 (glibc 2.35), not inherit a moving runner ABI.
    runs-on: ubuntu-22.04
    strategy:
      # One architecture failing lets the other finish. Seeing both is what distinguishes a problem
      # in the code from a problem in the cross-compilation.
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            flavor: base
            libc: gnu
            triple: x86_64-unknown-linux-gnu
          - arch: aarch64
            flavor: base
            libc: gnu
            triple: aarch64-unknown-linux-gnu
            # The control plane cross-compiling itself to aarch64 needs a linker. (The two agents
            # are built by build.rs with zig and rust-lld, and are unrelated to this.)
            apt: gcc-aarch64-linux-gnu
          - arch: x86_64
            flavor: base
            libc: musl
            triple: x86_64-unknown-linux-musl
            zig_target: x86_64-linux-musl
            cc_var: CC_x86_64_unknown_linux_musl
            ar_var: AR_x86_64_unknown_linux_musl
            linker_var: CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER
          - arch: aarch64
            flavor: base
            libc: musl
            triple: aarch64-unknown-linux-musl
            zig_target: aarch64-linux-musl
            cc_var: CC_aarch64_unknown_linux_musl
            ar_var: AR_aarch64_unknown_linux_musl
            linker_var: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER
          - arch: x86_64
            flavor: cvm
            libc: gnu
            triple: x86_64-unknown-linux-gnu
          - arch: aarch64
            flavor: cvm
            libc: gnu
            triple: aarch64-unknown-linux-gnu
            # The control plane cross-compiling itself to aarch64 needs a linker. (The two agents
            # are built by build.rs with zig and rust-lld, and are unrelated to this.)
            apt: gcc-aarch64-linux-gnu
          - arch: x86_64
            flavor: cvm
            libc: musl
            triple: x86_64-unknown-linux-musl
            zig_target: x86_64-linux-musl
            cc_var: CC_x86_64_unknown_linux_musl
            ar_var: AR_x86_64_unknown_linux_musl
            linker_var: CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER
          - arch: aarch64
            flavor: cvm
            libc: musl
            triple: aarch64-unknown-linux-musl
            zig_target: aarch64-linux-musl
            cc_var: CC_aarch64_unknown_linux_musl
            ar_var: AR_aarch64_unknown_linux_musl
            linker_var: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/configure-apt
        if: matrix.apt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Read Xray minimum compiler
        id: xray-go
        run: |
          pinned=$(cat "$GITHUB_WORKSPACE/components/xray-core/.go-version")
          echo "version=~${pinned}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ steps.xray-go.outputs.version }}
          check-latest: true
          cache-dependency-path: components/xray-core/go.sum

      - name: Install the toolchain rust-toolchain.toml declares
        run: rustup toolchain install

      - name: Install ${{ matrix.triple }}
        run: rustup target add ${{ matrix.triple }}

      - name: Install the cross linker
        if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - uses: ./.github/actions/install-zig

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Restore Xray reproducibility evidence
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/brocade-xray-verified/records.json
          key: xray-evidence-v1-${{ runner.os }}-${{ matrix.triple }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: xray-evidence-v1-${{ runner.os }}-${{ matrix.triple }}-

      - name: cargo build --release
        env:
          # Set for both architectures, because it applies only to the aarch64 target and the
          # x86_64 leg simply never reads it. Interpolating it out of the matrix instead would give
          # the x86_64 leg an empty string — which tells cargo "the linker is empty", not "unset".
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          BROCADE_ZIG_TARGET: ${{ matrix.zig_target }}
          MUSL_CC_VAR: ${{ matrix.cc_var }}
          MUSL_AR_VAR: ${{ matrix.ar_var }}
          MUSL_LINKER_VAR: ${{ matrix.linker_var }}
        run: |
          if [ "${{ matrix.libc }}" = musl ]; then
            export "$MUSL_CC_VAR=$GITHUB_WORKSPACE/scripts/zig-cc"
            export "$MUSL_AR_VAR=$GITHUB_WORKSPACE/scripts/zig-ar"
            export "$MUSL_LINKER_VAR=rust-lld"
          fi
          set --
          if [ '${{ matrix.flavor }}' = cvm ]; then set -- --features brocade-console/cvm; fi
          cargo build --release --locked --no-default-features --target ${{ matrix.triple }} \
            -p brocade-console -p brocade-launcher "$@"

      - name: Exercise static launcher and managed PostgreSQL on GNU libc
        if: matrix.arch == 'x86_64' && matrix.libc == 'musl'
        env:
          BROCADE_RUN_LAUNCHER_PG_TESTS: "1"
          BROCADE_UPGRADE_CONSOLE_BIN: ${{ github.workspace }}/target/${{ matrix.triple }}/release/brocade-console
          BROCADE_ZIG_TARGET: x86_64-linux-musl
          CC_x86_64_unknown_linux_musl: ${{ github.workspace }}/scripts/zig-cc
          AR_x86_64_unknown_linux_musl: ${{ github.workspace }}/scripts/zig-ar
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: |
          cargo test -p brocade-launcher --release --locked \
            --target x86_64-unknown-linux-musl -- --include-ignored

      - name: Preserve embedded Xray build records
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xray-build-records-${{ matrix.flavor }}-${{ matrix.triple }}
          path: target/${{ matrix.triple }}/release/build/brocade-console-*/out/xray-*.build.json
          if-no-files-found: error

      # Say what was actually produced. This binary carries both agents and the whole front end, so
      # the checksum belongs here to be compared against on the machine before anything is replaced.
      # The glibc line answers "will this run there": if the target's `ldd --version` is below the
      # floor printed here, do not deploy it.
      - name: Report the artifact
        run: |
          set -eu
          out=target/${{ matrix.triple }}/release
          for bin in "$out/brocade-launcher" "$out/brocade-console"; do
            ls -l "$bin"
            sha256sum "$bin"
            file -b "$bin"
            if [ "${{ matrix.libc }}" = gnu ]; then
              glibc_floor=$(readelf -V "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/^GLIBC_//' | sort -uV | tail -1)
              [ -n "$glibc_floor" ]
              echo "highest glibc symbol required: $glibc_floor"
              if [ "$(printf '%s\n' 2.35 "$glibc_floor" | sort -V | tail -1)" != 2.35 ]; then
                echo "GNU bundle requires glibc newer than the supported 2.35 baseline: $bin" >&2
                exit 1
              fi
              needed=$(readelf -d "$bin" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p')
              unexpected=$(printf '%s\n' "$needed" | grep -Ev \
                '^(libc\.so\.6|libm\.so\.6|libgcc_s\.so\.1|liblzma\.so\.5|ld-linux-x86-64\.so\.2|ld-linux-aarch64\.so\.1)$' || true)
              if [ -n "$unexpected" ]; then
                printf 'GNU bundle contains a dependency install.sh does not own:\n%s\n' "$unexpected" >&2
                exit 1
              fi
            elif readelf -d "$bin" 2>/dev/null | grep -q NEEDED; then
              echo "musl bundle contains an unexpected dynamic library dependency: $bin" >&2
              exit 1
            fi
          done

      - name: Assemble the versioned distribution
        id: dist
        run: |
          set -eu
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c \
            'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "brocade-launcher"))')
          dist_root=target/dist
          dist_name=brocade-dist-${version}-${{ matrix.flavor }}-linux-${{ matrix.arch }}-${{ matrix.libc }}
          bundle=$dist_root/$dist_name
          mkdir -p "$bundle"
          cp target/${{ matrix.triple }}/release/brocade-launcher "$bundle/"
          cp target/${{ matrix.triple }}/release/brocade-console "$bundle/"
          cp install.sh "$bundle/"
          printf '%s-%s\n' '${{ matrix.arch }}' '${{ matrix.libc }}' > "$bundle/BROCADE_PLATFORM"
          printf '%s\n' '${{ matrix.flavor }}' > "$bundle/BROCADE_FLAVOR"
          (cd "$bundle" && sha256sum brocade-launcher brocade-console install.sh BROCADE_PLATFORM BROCADE_FLAVOR > SHA256SUMS)
          tar -C "$dist_root" -czf "$dist_root/$dist_name.tar.gz" "$dist_name"
          (cd "$dist_root" && sha256sum "$dist_name.tar.gz" > "$dist_name.tar.gz.sha256")
          echo "name=$dist_name" >> "$GITHUB_OUTPUT"
          echo "archive=$dist_root/$dist_name.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=$dist_root/$dist_name.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.dist.outputs.name }}
          path: |
            ${{ steps.dist.outputs.archive }}
            ${{ steps.dist.outputs.checksum }}
          if-no-files-found: error

  product-distribution:
    name: first-release distribution identity
    needs: [build]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        flavor: [base, cvm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read candidate version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: brocade-dist-${{ steps.version.outputs.value }}-${{ matrix.flavor }}-linux-x86_64-gnu
          path: product-inputs
      - name: Verify archive, product metadata and native executable
        run: |
          set -eu
          (cd product-inputs && sha256sum -c *.sha256)
          mkdir product-candidate
          tar -xzf product-inputs/*.tar.gz --strip-components=1 -C product-candidate
          (cd product-candidate && sha256sum -c SHA256SUMS)
          cmp install.sh product-candidate/install.sh
          test "$(cat product-candidate/BROCADE_FLAVOR)" = '${{ matrix.flavor }}'
          product-candidate/brocade-console product-info > product-candidate/product-info.json
          python3 - '${{ matrix.flavor }}' <<'PYCODE'
          import json,sys
          manifest=json.load(open('product-candidate/product-info.json'))
          assert manifest == {'flavor':sys.argv[1],'features':{'cvm':sys.argv[1]=='cvm'}}
          PYCODE
