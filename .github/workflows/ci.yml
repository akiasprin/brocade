name: ci-network-diagnostics

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network:
    name: DNS and HTTPS diagnostics (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/configure-apt
      - name: Compare runner, root and APT network access
        run: |
          python3 -u - <<'PY'
          import json, os, pathlib, re, shutil, stat, subprocess
          def probe(label, args, timeout=10):
              try:
                  result = subprocess.run(args, capture_output=True, text=True, timeout=timeout)
                  text = result.stdout + result.stderr
                  text = re.sub(r'(https?://)[^/@\s]+:[^/@\s]+@', r'\1[redacted]@', text)
                  print(json.dumps({'probe': label, 'exit': result.returncode, 'output': text[-3000:]}), flush=True)
              except subprocess.TimeoutExpired:
                  print(json.dumps({'probe': label, 'timeout_seconds': timeout}), flush=True)
          path = pathlib.Path('/etc/resolv.conf')
          print(json.dumps({'resolver_path': str(path.resolve()), 'mode': oct(stat.S_IMODE(path.stat().st_mode)), 'nameservers': [line for line in path.read_text().splitlines() if line.startswith('nameserver')]}), flush=True)
          proxy = "import json,os; print(json.dumps({k:bool(os.environ.get(k)) for k in ['http_proxy','https_proxy','HTTP_PROXY','HTTPS_PROXY','ALL_PROXY','NO_PROXY']}))"
          probe('runner proxy variable presence', ['python3', '-c', proxy])
          probe('root proxy variable presence', ['sudo', 'python3', '-c', proxy])
          probe('apt executable', ['bash', '-c', 'type -a apt-get; readlink -f /usr/bin/apt-get'])
          probe('apt sandbox', ['apt-config', 'shell', 'SandboxUser', 'APT::Sandbox::User', 'ForceIPv4', 'Acquire::ForceIPv4'])
          probe('apt resolver readability', ['sudo', '-u', '_apt', 'test', '-r', '/etc/resolv.conf'])
          codename = dict(line.split('=', 1) for line in pathlib.Path('/etc/os-release').read_text().splitlines() if '=' in line)['VERSION_CODENAME'].strip('"')
          urls = ['https://archive.ubuntu.com/ubuntu/dists/' + codename + '/InRelease', 'https://security.ubuntu.com/ubuntu/dists/' + codename + '-security/InRelease']
          for role, prefix in [('runner', []), ('root', ['sudo']), ('apt', ['sudo', '-u', '_apt'])]:
              for host in ['archive.ubuntu.com', 'github.com']:
                  probe(role + ' DNS ' + host, prefix + ['getent', 'ahostsv4', host], timeout=8)
              for url in urls:
                  probe(role + ' HTTPS ' + url, prefix + ['curl', '-fsS', '--connect-timeout', '4', '--max-time', '8', '-o', '/dev/null', '-w', 'status=%{http_code} remote=%{remote_ip}\n', url], timeout=10)
          if shutil.which('dig'):
              probe('public DNS lookup', ['dig', '+time=2', '+tries=1', '@1.1.1.1', 'archive.ubuntu.com', 'A'], timeout=4)
          PY
      - name: Verify signed Ubuntu package downloads
        run: |
          sudo apt-get update --error-on=any
          sudo apt-get install -y --download-only --no-install-recommends libcap-ng-dev libseccomp-dev
          test -n "$(find /var/cache/apt/archives -maxdepth 1 -name 'libcap-ng-dev_*.deb' -print -quit)"
          test -n "$(find /var/cache/apt/archives -maxdepth 1 -name 'libseccomp-dev_*.deb' -print -quit)"
