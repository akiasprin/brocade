name: configure-apt
description: Use the Ubuntu HTTPS archives for hosted amd64 runner dependencies.

runs:
  using: composite
  steps:
    - name: Prefer Ubuntu HTTPS mirrors
      shell: bash
      run: |
        set -euo pipefail
        [ "$(dpkg --print-architecture)" = amd64 ] || {
          echo 'configure-apt requires an Ubuntu amd64 hosted runner' >&2
          exit 1
        }
        [ -f /etc/apt/apt-mirrors.txt ] || {
          echo 'hosted runner APT mirror list is missing' >&2
          exit 1
        }
        # Some hosted resolvers time out for Ubuntu names even while other DNS
        # queries work. Change the ephemeral runner link only after a failed probe.
        if ! timeout 8 getent ahostsv4 archive.ubuntu.com > /dev/null ||
           ! timeout 8 getent ahostsv4 security.ubuntu.com > /dev/null; then
          ci_default_link=$(ip -o route show default | awk '{for (i = 1; i < NF; i++) if ($i == "dev") {print $(i + 1); exit}}')
          [ -n "$ci_default_link" ] || {
            echo 'no default network link for DNS recovery' >&2
            exit 1
          }
          sudo resolvectl dns "$ci_default_link" 1.1.1.1 8.8.8.8
          sudo resolvectl domain "$ci_default_link" '~.'
          sudo resolvectl flush-caches
        fi
        timeout 8 getent ahostsv4 archive.ubuntu.com > /dev/null
        timeout 8 getent ahostsv4 security.ubuntu.com > /dev/null
        echo 'Ubuntu archive DNS checks passed'
        # The hosted image puts Azure first. A DNS outage there can exhaust setup
        # before tests start; retain the two signed Ubuntu archive mirrors.
        printf '%s\tpriority:%s\n' \
          'https://archive.ubuntu.com/ubuntu/' 1 \
          'https://security.ubuntu.com/ubuntu/' 2 |
          sudo tee /etc/apt/apt-mirrors.txt > /dev/null
        # Sort after image defaults and bound dependency fetches, not builds/tests.
        sudo tee /etc/apt/apt.conf.d/zzz-brocade-ci > /dev/null <<'EOF'
        Acquire::Retries "1";
        Acquire::http::Timeout "15";
        Acquire::https::Timeout "15";
        EOF
        cat /etc/apt/apt-mirrors.txt
        apt-config shell CI_APT_RETRIES Acquire::Retries \
          CI_APT_HTTP_TIMEOUT Acquire::http::Timeout \
          CI_APT_HTTPS_TIMEOUT Acquire::https::Timeout
