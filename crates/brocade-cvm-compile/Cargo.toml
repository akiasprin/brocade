[package]
name = "brocade-cvm-compile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
brocade-core = { path = "../brocade-core" }
brocade-deployment = { path = "../brocade-deployment", features = ["cvm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }

[build-dependencies]
protox = "0.9"
prost = "0.14"
