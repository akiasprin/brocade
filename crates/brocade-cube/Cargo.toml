[package]
name = "brocade-cube"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Node-local Cube execution, durable recovery and Guest I/O for Brocade Agent"

[dependencies]
cube-terminal = { path = "../../components/cube/CubeShim/terminal" }
brocade-core = { path = "../brocade-core" }
brocade-deployment = { path = "../brocade-deployment", features = ["cvm"] }
base64 = "0.22.1"
getrandom = "0.3"
libc = "0.2"
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
prost-types = "0.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen"] }
tonic-prost = "0.14"
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }

[build-dependencies]
protox = "0.9"
prost = "0.14"
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "router"] }
