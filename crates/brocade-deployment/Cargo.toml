[package]
name = "brocade-deployment"
version.workspace = true
description = "brocade 的发布计划与控制面/节点之间的协议类型"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
cvm = ["dep:cube-terminal"]

[dependencies]
cube-terminal = { path = "../../components/cube/CubeShim/terminal", optional = true }
brocade-core = { path = "../brocade-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
base64 = "0.22.1"
