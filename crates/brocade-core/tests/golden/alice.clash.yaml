# Brocade · SubBoost 标准版（请求时动态生成）
mixed-port: 7897
allow-lan: true
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: strict

dns:
  enable: true
  listen: 127.0.0.1:5335
  ipv6: true
  use-system-hosts: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver: [223.5.5.5, 119.29.29.29, 8.8.8.8]
  nameserver: [223.5.5.5, 119.29.29.29, "https://dns.alidns.com/dns-query", "https://cloudflare-dns.com/dns-query"]
  fallback: ["https://dns.quad9.net/dns-query", "https://dns.google/dns-query"]
  fallback-filter:
    geoip: true
    ipcidr: [240.0.0.0/4, 0.0.0.0/32, 127.0.0.1/32]
  fake-ip-filter: ["*.lan", "*.local", "stun.*.*", time.windows.com, time.apple.com, pool.ntp.org, localhost]

profile:
  store-selected: true
  store-fake-ip: false

sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    TLS: {ports: [443, 8443]}
    HTTP: {ports: [80, "8080-8880"], override-destination: true}
    QUIC: {ports: [443, 8443]}
  skip-domain:
    - "apps.apple.com"
    - "www.amazon.co.jp"
    - "www.apple.com"
    - "www.bing.com"
    - "www.icloud.com"
    - "www.yahoo.co.jp"

