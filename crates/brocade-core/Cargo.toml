[package]
name = "brocade-core"
version.workspace = true
description = "brocade 的编译器：吃一份模型快照，吐出每台机器的配置产物。纯函数、无 IO"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
ipnet = { version = "2.11.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
# Deriving the probe credential's UUID (model::probe_uuid). Pure Rust, and builds for wasm targets
# as well.
sha2 = "0.10"

[dev-dependencies]
# Only the acceptance test that runs the real xray binary: an inbound presenting a certificate
# refuses to build without one on disk, so the test has to make one. The compiler itself has no
# certificate dependency at all — it writes a path and nothing more.
rcgen = "0.14"
