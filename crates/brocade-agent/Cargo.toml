[package]
name = "brocade-agent"
version.workspace = true
description = "brocade 跑在节点上的收敛程序：拉期望状态、落配置、上报观测与用量"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
brocade-core = { path = "../brocade-core" }
brocade-deployment = { path = "../brocade-deployment" }
brocade-probe = { path = "../brocade-probe" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
flate2 = "1.1"
# Probing path MTU needs our own ICMP socket: shelling out to ping depends on which
# implementation is installed (BusyBox's does not understand -M) and can only treat an
# exit code as a measurement. See the argument at the top of src/icmp.rs.
libc = "0.2"
# HTTP framing and deadlines use the same reqwest/rustls stack as the Console.
# Keep native TLS, OpenSSL and AWS-LC out of static musl builds.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots", "socks"] }
# The live channel has its own single-thread runtime; HTTP and collection retain their independent schedules.
tokio = { version = "1", features = ["sync", "rt", "net", "time", "macros"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# Trust anchors are compiled into the binary rather than read from the target machine's
# /etc/ssl/certs. The agent installs on other people's machines, and how old that root store
# is — or whether it exists at all, which slim Alpine images often do not — should not decide
# whether the agent can reach the control plane. The cost is 53KB and a store that ages with
# the agent version — but the latter is in our hands and a new agent release fixes it, while
# the former is not.
webpki-roots = "1.0.9"
# The live channel negotiates standard permessage-deflate with default compression settings.
# TLS still uses our compiled trust anchors and shared handshake deadline.
yawc = { version = "=0.5.0", default-features = false, features = ["tls"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
base64 = "0.22.1"

[dev-dependencies]
# Exercise rolling upgrades against a peer without compression support.
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
