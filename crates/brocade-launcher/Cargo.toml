[package]
name = "brocade-launcher"
version.workspace = true
description = "Brocade 一键启动器：管理本机 PostgreSQL 与 Console"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "brocade-launcher"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.3"
libc = "0.2"
liblzma = { version = "0.4.8", default-features = false }
postgresql_embedded = { version = "=0.21.0", default-features = false, features = ["tokio", "tls-rustls-ring"] }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio"] }
tempfile = "3"
tar = { version = "0.4.46", default-features = false }
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
