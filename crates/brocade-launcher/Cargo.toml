[package]
name = "brocade-launcher"
version.workspace = true
description = "Brocade 一键启动器：管理本机 PostgreSQL、Console 与可选 Cloudflare Tunnel"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "brocade-launcher"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.3"
libc = "0.2"
postgresql_archive = { version = "=0.21.0", default-features = false, features = ["zonky", "tls-rustls-ring"] }
postgresql_embedded = { version = "=0.21.0", default-features = false, features = ["tokio", "zonky", "tls-rustls-ring"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
